<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-labelledby="title desc">
  <title id="title">Hello, World! — Kaapywara</title>
  <desc id="desc">An animated purple glitch alternates between Hello, World! and Kaapywara.</desc>

  <defs>
    <linearGradient id="purple" x1="0" x2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="0.48" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-70%" width="160%" height="240%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .word {
      font-family: "Fira Code", "Cascadia Code", Consolas, monospace;
      font-size: 72px;
      font-weight: 700;
      letter-spacing: -2px;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .hello { animation: showHello 8s infinite; }
    .name  { animation: showName 8s infinite; }
    .cyan  { fill: #38bdf8; animation: cyanShift 8s infinite; }
    .pink  { fill: #ff2ea6; animation: pinkShift 8s infinite; }
    .main  { fill: url(#purple); filter: url(#glow); }

    @keyframes showHello {
      0%, 42%, 100% { opacity: 1; }
      44%, 94% { opacity: 0; }
      95%, 98% { opacity: 0.75; }
    }

    @keyframes showName {
      0%, 42%, 100% { opacity: 0; }
      44%, 94% { opacity: 1; }
      95%, 98% { opacity: 0.25; }
    }

    @keyframes cyanShift {
      0%, 38%, 48%, 90%, 100% { opacity: 0; transform: translate(0, 0); }
      39% { opacity: .9; transform: translate(-10px, 2px); }
      41% { opacity: .55; transform: translate(8px, -3px); }
      43% { opacity: .85; transform: translate(-5px, 1px); }
      92% { opacity: .8; transform: translate(9px, -2px); }
      94% { opacity: .5; transform: translate(-7px, 3px); }
      96% { opacity: .75; transform: translate(4px, -1px); }
    }

    @keyframes pinkShift {
      0%, 38%, 48%, 90%, 100% { opacity: 0; transform: translate(0, 0); }
      39% { opacity: .8; transform: translate(9px, -2px); }
      41% { opacity: .6; transform: translate(-7px, 3px); }
      43% { opacity: .9; transform: translate(5px, -1px); }
      92% { opacity: .85; transform: translate(-10px, 2px); }
      94% { opacity: .55; transform: translate(7px, -3px); }
      96% { opacity: .8; transform: translate(-4px, 1px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .hello { animation: none; opacity: 0; }
      .name, .cyan, .pink { animation: none; }
      .cyan, .pink { opacity: 0; }
    }
  </style>

  <g class="hello">
    <text class="word cyan" x="450" y="90">Hello, World!</text>
    <text class="word pink" x="450" y="90">Hello, World!</text>
    <text class="word main" x="450" y="90">Hello, World!</text>
  </g>

  <g class="name">
    <text class="word cyan" x="450" y="90">Kaapywara</text>
    <text class="word pink" x="450" y="90">Kaapywara</text>
    <text class="word main" x="450" y="90">Kaapywara</text>
  </g>
</svg>
